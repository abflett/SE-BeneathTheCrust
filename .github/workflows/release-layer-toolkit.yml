name: Release Working Knowledge Layer Toolkit

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify toolkit release identity
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content tools/WorkingKnowledgeLayerToolkit/VERSION.txt -Raw).Trim()
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag must match the standalone toolkit VERSION.txt.' }
          if (-not (Test-Path "docs/WorkingKnowledge/releases/toolkit-$version.md")) { throw 'Missing versioned release notes.' }

      - name: Validate and package the standalone toolkit
        shell: pwsh
        run: |
          [xml] $modInfo = Get-Content mods/WorkingKnowledge/modinfo.sbc -Raw
          ./tools/validate-working-knowledge-release.ps1 -ExpectedVersion $modInfo.ModItem.Version -SkipCompile

      - name: Publish GitHub release and ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content tools/WorkingKnowledgeLayerToolkit/VERSION.txt -Raw).Trim()
          $archive = ".tmp/releases/WorkingKnowledgeLayerToolkit-$version.zip"
          gh release create $env:RELEASE_TAG $archive --verify-tag --title "Working Knowledge Layer Toolkit $version" --notes-file "docs/WorkingKnowledge/releases/toolkit-$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
